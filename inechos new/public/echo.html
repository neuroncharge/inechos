  <style>
    /* ======================================================================
       Isolated Solo Pong Game Styles (wp-game-* prefix only)
       100% offline · Matches #F7F6F0 / #1E1E1E / #6E6D68 / #DCDAD0 palette
       ====================================================================== */
    .wp-game-section {
      display: block;
      width: 100%;
      max-width: min(440px, 58vh);
    }

    .wp-game-hud {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      margin-bottom: 18px;
      border-bottom: 1px solid #DCDAD0;
      font-family: 'Courier Prime', 'Space Mono', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
    }

    .wp-game-stat {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .wp-game-stat-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: #6E6D68;
    }

    .wp-game-stat-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      color: #1E1E1E;
      font-variant-numeric: tabular-nums;
    }

    .wp-game-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 440 / 520;
      background-color: #F7F6F0;
      border: 1px solid #DCDAD0;
      overflow: hidden;
    }

    .wp-game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    .wp-game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-color: rgba(247, 246, 240, 0.92);
      font-family: 'Courier Prime', 'Space Mono', 'Courier New', monospace;
      transition: opacity 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wp-game-overlay-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .wp-game-overlay-title {
      margin: 0 0 10px 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1E1E1E;
    }

    .wp-game-overlay-meta {
      margin: 0 0 24px 0;
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6E6D68;
      font-variant-numeric: tabular-nums;
    }

    .wp-game-btn {
      appearance: none;
      min-height: 44px;
      padding: 11px 24px;
      background-color: #1E1E1E;
      color: #F7F6F0;
      border: 1px solid #1E1E1E;
      font-family: 'Courier Prime', 'Space Mono', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }

    .wp-game-btn:hover {
      background-color: #F7F6F0;
      color: #1E1E1E;
    }

    .wp-game-btn:focus-visible {
      outline: 2px solid #1E1E1E;
      outline-offset: 3px;
    }

    .wp-game-controls-hint {
      margin: 14px 0 0 0;
      font-family: 'Courier Prime', 'Space Mono', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6E6D68;
      text-align: center;
    }
  </style>
